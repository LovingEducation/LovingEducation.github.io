        <!-- Past Papers Logic -->
            <script>
                // Firebase init
                firebase.initializeApp({
                    apiKey: "AIzaSyC0l_7ENdicpO1R_O2h9nEYtSaTMpsyzoQ",
                    authDomain: "loving-education.firebaseapp.com",
                    projectId: "loving-education",
                    storageBucket: "loving-education.firebasestorage.app",
                    messagingSenderId: "917807733153",
                    appId: "1:917807733153:web:3bb5da5b5a7ae9088593e0"
                });
                var db = firebase.firestore();

                // Cloudinary config
                var CLOUD_NAME = 'pq8zxaw5';
                var UPLOAD_PRESET = 'loving_education_unsigned';
                var CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/auto/upload';

                var gradeKeys = ['6', '7', '8'];
                var gradeNames = { '6': '6th Grade', '7': '7th Grade', '8': '8th Grade' };

                var subjectKeys = ['english', 'mathematics', 'science', 'sinhala', 'civic', 'geography', 'tamil', 'aesthetic', 'health-science', 'history', 'buddhism', 'pts'];
                var aestheticKeys = ['art', 'dancing', 'western-music', 'eastern-music', 'drama'];
                var termKeys = ['first', 'second', 'third'];

                var subjectNames = {
                    english: { english: 'English', sinhala: 'ඉංග්රීසි' },
                    mathematics: { english: 'Mathematics', sinhala: 'ගණිතය' },
                    science: { english: 'Science', sinhala: 'විද්‍යාව' },
                    sinhala: { english: 'Sinhala', sinhala: 'සිංහල' },
                    civic: { english: 'Civic', sinhala: 'පුරවැසි අධ්‍යාපනය' },
                    geography: { english: 'Geography', sinhala: 'භූගෝලය' },
                    tamil: { english: 'Tamil', sinhala: 'දෙමළ' },
                    aesthetic: { english: 'Aesthetic', sinhala: 'සෞන්දර්ය' },
                    'health-science': { english: 'Health Science', sinhala: 'සෞඛ්‍ය විද්‍යාව' },
                    history: { english: 'History', sinhala: 'ඉතිහාසය' },
                    buddhism: { english: 'Buddhism', sinhala: 'බුද්ධාගම' },
                    pts: { english: 'PTS', sinhala: 'PTS' }
                };

                var aestheticNames = {
                    art: { english: 'Art', sinhala: 'කලා' },
                    dancing: { english: 'Dancing', sinhala: 'නැටුම්' },
                    'western-music': { english: 'Western Music', sinhala: 'බටහිර සංගීතය' },
                    'eastern-music': { english: 'Eastern Music', sinhala: 'නැගෙනහිර සංගීතය' },
                    drama: { english: 'Drama', sinhala: 'නාට්‍ය' }
                };

                var termNames = {
                    first: { english: 'First Term', sinhala: 'පළමු වාරය' },
                    second: { english: 'Second Term', sinhala: 'දෙවන වාරය' },
                    third: { english: 'Third Term', sinhala: 'තුන්වන වාරය' }
                };

                var state = {
                    grade: null,
                    medium: null,
                    subjectKey: null,
                    aestheticKey: null,
                    termKey: null,
                    mode: null,
                    uploadName: null,
                    role: null
                };

                function setStep(html) {
                    document.getElementById('step-content').innerHTML = html;
                }

                function backBtn(text, fn) {
                    return '<a href="#" class="button" onclick="' + fn + '(); return false;" style="display:inline-block; margin-bottom:1.5em;">&larr; ' + text + '</a>';
                }

                function stripBlock(name, fn) {
                    return '<a href="#" onclick="' + fn + '(); return false;" style="display:block; background:#000000; color:#ffffff; padding:1em 1.5em; text-decoration:none; border-bottom:none; margin-bottom:0.5em; border-radius:5px; transition:background 0.2s;" onmouseover="this.style.background=\'#444444\'" onmouseout="this.style.background=\'#000000\'">' + name + '</a>';
                }

                function paperStrip(name, url) {
                    return '<a href="' + url + '" target="_blank" style="display:block; padding:1em 1.5em; text-decoration:none; border-bottom:none; margin-bottom:0.5em; border-radius:5px; border:2px solid; border-image:linear-gradient(to right, #22c55e, #eab308) 1; color:#ffffff; background:rgba(255,255,255,0.025); transition:background 0.2s;" onmouseover="this.style.background=\'rgba(255,255,255,0.06)\'" onmouseout="this.style.background=\'rgba(255,255,255,0.025)\'">' + name + '</a>';
                }

                function showGradeSelect() {
                    state.grade = null; state.medium = null; state.subjectKey = null; state.aestheticKey = null; state.termKey = null;
                    var h = backBtn('Back', 'goBack');
                    h += '<h3 class="major">Select Grade</h3>';
                    for (var i = 0; i < gradeKeys.length; i++) h += stripBlock(gradeNames[gradeKeys[i]], "pickGrade('" + gradeKeys[i] + "')");
                    setStep(h);
                }

                function pickGrade(g) { state.grade = g; showMediumSelect(); }

                function showMediumSelect() {
                    state.medium = null; state.subjectKey = null; state.aestheticKey = null; state.termKey = null;
                    var h = backBtn('Back', 'showGradeSelect');
                    h += '<h3 class="major">Select Medium</h3>';
                    h += stripBlock('English', "pickMedium('english')");
                    h += stripBlock('සිංහල', "pickMedium('sinhala')");
                    setStep(h);
                }

                function pickMedium(m) { state.medium = m; showSubjectSelect(); }

                function showSubjectSelect() {
                    var h = backBtn('Back', 'showMediumSelect');
                    h += '<h3 class="major">Select Subject</h3>';
                    for (var i = 0; i < subjectKeys.length; i++) h += stripBlock(subjectNames[subjectKeys[i]][state.medium], "pickSubject('" + subjectKeys[i] + "')");
                    setStep(h);
                }

                function pickSubject(key) {
                    state.subjectKey = key;
                    if (key === 'aesthetic') showAestheticSelect(); else showTermSelect();
                }

                function showAestheticSelect() {
                    var h = backBtn('Back', 'showSubjectSelect');
                    h += '<h3 class="major">Select Aesthetic Subject</h3>';
                    for (var i = 0; i < aestheticKeys.length; i++) h += stripBlock(aestheticNames[aestheticKeys[i]][state.medium], "pickAesthetic('" + aestheticKeys[i] + "')");
                    setStep(h);
                }

                function pickAesthetic(key) { state.aestheticKey = key; showTermSelect(); }

                function showTermSelect() {
                    var h = backBtn('Back', 'state.subjectKey === \'aesthetic\' ? showAestheticSelect : showSubjectSelect');
                    h += '<h3 class="major">Select Term</h3>';
                    for (var i = 0; i < termKeys.length; i++) h += stripBlock(termNames[termKeys[i]][state.medium], "pickTerm('" + termKeys[i] + "')");
                    setStep(h);
                }

                function pickTerm(key) {
                    state.termKey = key;
                    if (state.mode === 'upload') showUploadFile(); else showPapers();
                }

                function showPapers() {
                    setStep('<p style="text-align:center; opacity:0.5;">Loading papers...</p>');
                    db.collection('papers')
                        .where('grade', '==', state.grade)
                        .where('medium', '==', state.medium)
                        .where('subjectKey', '==', state.subjectKey)
                        .where('termKey', '==', state.termKey)
                        .get().then(function(snapshot) {
                            var h = backBtn('Back', 'showTermSelect');
                            var count = 0;
                            snapshot.forEach(function(doc) {
                                var p = doc.data();
                                if (state.subjectKey === 'aesthetic' && p.aestheticKey !== state.aestheticKey) return;
                                h += paperStrip(p.name, p.fileUrl);
                                count++;
                            });
                            if (count === 0) h += '<p style="text-align:center; opacity:0.5; padding:2em 0;">Unable to find Papers</p>';
                            setStep(h);
                        }).catch(function(err) {
                            setStep(backBtn('Back', 'showTermSelect') + '<p style="text-align:center; opacity:0.5; padding:2em 0;">Error loading papers</p>');
                        });
                }

                function showAdminChoice() {
                    var h = backBtn('Back', "window.location.href='generic.html'");
                    h += '<h3 class="major">What would you like to do?</h3>';
                    h += '<p style="margin-bottom:1.5em;">Are you here to moderate this section, or just browsing?</p>';
                    h += '<ul class="actions">';
                    h += '<li><a href="#" class="button primary" onclick="startUpload(); return false;">Moderate</a></li>';
                    h += '<li><a href="#" class="button" onclick="startBrowse(); return false;">Just Browsing</a></li>';
                    h += '</ul>';
                    setStep(h);
                }

                function startUpload() { state.mode = 'upload'; showUploadName(); }
                function startBrowse() { state.mode = 'browse'; showGradeSelect(); }

                function showUploadName() {
                    var h = backBtn('Back', 'showAdminChoice');
                    h += '<h3 class="major">Name Your Paper</h3>';
                    h += '<p style="margin-bottom:1em;">Use an appropriate name with year and province (e.g. "2024 Western Province")</p>';
                    h += '<form onsubmit="return submitUploadName(event)">';
                    h += '<div class="fields"><div class="field">';
                    h += '<label for="paper-name">Paper Name</label>';
                    h += '<input type="text" name="paper-name" id="paper-name" placeholder="e.g. 2024 Western Province" required />';
                    h += '</div></div>';
                    h += '<ul class="actions"><li><input type="submit" value="Next" class="primary" /></li></ul>';
                    h += '</form>';
                    setStep(h);
                }

                function submitUploadName(e) {
                    e.preventDefault();
                    state.uploadName = document.getElementById('paper-name').value.trim();
                    if (!state.uploadName) { showNotify('Please enter a name'); return false; }
                    showGradeSelect();
                    return false;
                }

                function showUploadFile() {
                    var gradeLabel = gradeNames[state.grade];
                    var subjectLabel = subjectNames[state.subjectKey][state.medium];
                    if (state.subjectKey === 'aesthetic') subjectLabel += ' - ' + aestheticNames[state.aestheticKey][state.medium];
                    var termLabel = termNames[state.termKey][state.medium];
                    var mediumLabel = state.medium === 'english' ? 'English' : 'සිංහල';

                    var h = backBtn('Back', 'showTermSelect');
                    h += '<h3 class="major">Upload Paper</h3>';
                    h += '<div class="box" style="margin-bottom:1.5em;">';
                    h += '<p><strong>Name:</strong> ' + state.uploadName + '</p>';
                    h += '<p><strong>Grade:</strong> ' + gradeLabel + '</p>';
                    h += '<p><strong>Medium:</strong> ' + mediumLabel + '</p>';
                    h += '<p><strong>Subject:</strong> ' + subjectLabel + '</p>';
                    h += '<p><strong>Term:</strong> ' + termLabel + '</p>';
                    h += '</div>';
                    h += '<form onsubmit="return submitUploadFile(event)">';
                    h += '<div class="fields"><div class="field">';
                    h += '<label for="paper-file">Select PDF</label>';
                    h += '<input type="file" name="paper-file" id="paper-file" accept=".pdf" required />';
                    h += '</div></div>';
                    h += '<ul class="actions"><li><input type="submit" value="Upload Paper" class="primary" id="upload-btn" /></li></ul>';
                    h += '</form>';
                    setStep(h);
                }

                function submitUploadFile(e) {
                    e.preventDefault();
                    var fileInput = document.getElementById('paper-file');
                    var file = fileInput.files[0];
                    if (!file) { showNotify('Please select a file'); return false; }

                    var btn = document.getElementById('upload-btn');
                    btn.value = 'Uploading paper...';
                    btn.disabled = true;

                    var formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', UPLOAD_PRESET);
                    formData.append('folder', 'past-papers/' + state.grade + '/' + state.subjectKey);

                    fetch(CLOUDINARY_URL, { method: 'POST', body: formData })
                        .then(function(res) { return res.json(); })
                        .then(function(data) {
                            if (data.secure_url) {
                                var paperData = {
                                    name: state.uploadName,
                                    grade: state.grade,
                                    medium: state.medium,
                                    subjectKey: state.subjectKey,
                                    aestheticKey: state.aestheticKey || null,
                                    termKey: state.termKey,
                                    fileUrl: data.secure_url,
                                    uploadedBy: localStorage.getItem('le-currentUser'),
                                    uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
                                };
                                return db.collection('papers').add(paperData);
                            } else {
                                throw new Error('No URL returned');
                            }
                        })
                        .then(function() {
                            showNotify('Paper uploaded successfully!');
                            setTimeout(function() { showAdminChoice(); }, 1500);
                        })
                        .catch(function(err) {
                            showNotify('Upload failed: ' + err.message);
                            btn.value = 'Upload Paper';
                            btn.disabled = false;
                        });
                    return false;
                }

                function goBack() {
                    if (state.mode === 'upload') {
                        if (state.termKey) showTermSelect();
                        else if (state.subjectKey === 'aesthetic' && state.aestheticKey) showAestheticSelect();
                        else if (state.subjectKey) showSubjectSelect();
                        else if (state.medium) showMediumSelect();
                        else if (state.grade) showGradeSelect();
                        else if (state.uploadName) showUploadName();
                        else showAdminChoice();
                    } else {
                        if (state.termKey) showTermSelect();
                        else if (state.subjectKey === 'aesthetic' && state.aestheticKey) showAestheticSelect();
                        else if (state.subjectKey) showSubjectSelect();
                        else if (state.medium) showMediumSelect();
                        else window.location.href = 'generic.html';
                    }
                }

                // Init
                document.addEventListener('DOMContentLoaded', function() {
                    var currentUser = localStorage.getItem('le-currentUser');
                    if (!currentUser) { window.location.href = 'auth.html?mode=login'; return; }
                    var users = JSON.parse(localStorage.getItem('le-users') || '{}');
                    var user = users[currentUser];
                    if (!user) { window.location.href = 'auth.html?mode=login'; return; }
                    state.role = user.role;
                    if (user.role === 'admin') showAdminChoice();
                    else { state.mode = 'browse'; showGradeSelect(); }
                });
            </script>

        <!-- Notification popups -->
            <script>
                function showNotify(msg, isHTML, redirectURL) {
                    var old = document.querySelector('.notify-bar');
                    if (old) old.remove();
                    var bar = document.createElement('div');
                    bar.className = 'notify-bar';
                    if (isHTML) { bar.innerHTML = msg; } else { bar.textContent = msg; }
                    document.body.appendChild(bar);
                    setTimeout(function() { bar.classList.add('show'); }, 10);
                    bar.onclick = function() { dismissNotify(bar); };
                    setTimeout(function() { dismissNotify(bar); }, 15000);
                    if (redirectURL) {
                        setTimeout(function() {
                            if (bar.parentNode) bar.remove();
                            window.location.href = redirectURL;
                        }, 3000);
                    }
                }
                function dismissNotify(bar) {
                    if (!bar || !bar.parentNode) return;
                    bar.classList.remove('show');
                    setTimeout(function() { if (bar.parentNode) bar.remove(); }, 400);
                }
            </script>

    </body>
